<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    TONYAgent app icon. Kept as flat geometry with no gradients or filters so
    every raster size Tauri generates (.ico, .icns, .png) stays crisp; a
    gradient turns to mud at 32x32.

    Regenerate the rasters with:  npm run tauri icon src-tauri/icons/icon.svg
  -->
  <rect width="512" height="512" rx="96" fill="#2f6feb"/>
  <path
    d="M150 130h212a26 26 0 0 1 26 26v200a26 26 0 0 1-26 26H150a26 26 0 0 1-26-26V156a26 26 0 0 1 26-26z"
    fill="none"
    stroke="#ffffff"
    stroke-width="22"
    stroke-linejoin="round"/>
  <path
    d="M186 214h140M186 268h140M186 322h88"
    fill="none"
    stroke="#ffffff"
    stroke-width="20"
    stroke-linecap="round"/>
</svg>
