[project]
name = "tonyagent"
version = "0.1.0"
description = "A local AI agent for automating programming tasks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "keyring>=24.0.0",
    "loguru>=0.7.0",
    "httpx>=0.25.0",
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
    "ollama>=0.2.0",
    "playwright>=1.40.0",
    "docker>=7.0.0",
    "psutil>=5.9.0",
    "watchdog>=3.0.0",
    "markdown2>=2.4.0",
    "pygments>=2.17.0",
    "python-dotenv>=1.0.0",
    # The screen-capture tool, and nothing else. It was already installed on
    # this machine -- transitively, by a package that happens to want it -- and
    # `take_screenshot` imported it on the strength of that. Declared, so a
    # clean install cannot ship a tool that dies on import.
    "Pillow>=10.0.0",
    # What `delete_file`'s promise costs: a deletion the user can undo from
    # the recycle bin. The tool used to carry an `unlink()` fallback for a
    # missing install, which quietly turned the contract inside out on a
    # clean environment -- the transcript said recoverable while the file was
    # gone. Declared here so that cannot happen: a missing dependency is now
    # an error the model and the user can see.
    "send2trash>=1.8.0",
    # The window. This is the shell that used to be a Rust crate: `tonyagent.window`
    # opens a native window around the built frontend, starts the core as a child
    # process and carries messages between them. On Windows it brings pythonnet,
    # which is what puts the WebView2 control in a WinForms window; there is no
    # Rust toolchain, no cargo and no Windows SDK in the build any more.
    "pywebview>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-tomli>=2.0.0",
    "pre-commit>=3.6.0",
]
packaging = [
    "pyinstaller>=6.1.0",
    "nsis>=3.0.0",
]

[project.scripts]
# The terminal frontend. `python -m tonyagent.cli` runs the same code without an
# install, which is how it is developed; this is how it is used.
tony = "tonyagent.cli.repl:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tonyagent*"]

# The card's `grab`/`grabbing` cursors ship as files, not as calls: `CreateCursor`
# takes bitmasks and can only make 1-bit cursors, while a `.cur` read with
# `LoadImageW` may carry an alpha channel. Generated by `research/grab_cursor.py`,
# which is checked in alongside them so the asset can be reproduced, not just trusted.
[tool.setuptools.package-data]
"tonyagent.window" = ["cursors/*.cur"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "docker: real-Docker integration tests (needs Docker Desktop running, skipped in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T10", "T20", "PTH", "PIE", "PT", "Q", "RET", "SIM", "TD", "TRY", "NPY", "PERF", "RUF", "PL", "ARG", "PTH", "ERA", "PD", "TRV",
]
ignore = ["S101", "S110", "B008"]
# per-file-ignores = { "tests/*": ["S101", "S110"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
enable_error_code = ["ignore-without-action"]

[tool.coverage.run]
source = ["src/tonyagent"]
omit = ["tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]