[package]
name = "tonyagent-app"
version = "0.1.0"
description = "TONYAgent desktop shell"
authors = ["TONYAgent"]
edition = "2021"
rust-version = "1.77.2"

# The library is what the mobile entry points link against. On desktop the
# binary below is what actually runs, but Tauri expects this shape.
[lib]
name = "tonyagent_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The folder picker. A native dialog is the only way to get a real project
# path out of the user without hand-typing an escaping-sensitive string.
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Two sets of Win32 calls, for two things the app cannot do without the OS: the
# window has no system title bar, so it has to ask for the system menu itself
# (system_menu.rs), and turning the decorations off also turned off the rounded
# corners Windows 11 was drawing around the window, so it has to ask for those
# back (window_corners.rs). The version matches the one tauri already resolves,
# so this adds features and not a second copy of the crate. Target-scoped,
# because both calls are Windows' and both callers are `#[cfg(windows)]`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# The sidecar is a separate process; the Rust shell is a thin window manager
# around it, so an optimised build is small and fast to link.
panic = "abort"
strip = true
